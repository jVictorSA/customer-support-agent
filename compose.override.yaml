services:
  db:
    env_file:
      - .env
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  api:
    build:
      target: dev
    env_file:
      - .env
    command:
      - fastapi
      - dev
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      - .:/app
      - /app/.venv

  rabbitmq:
    env_file:
      - .env
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  minio:
    env_file:
      - .env
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  worker:
    build:
      target: worker-dev
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      MINIO_ENDPOINT: minio:9000
      RABBITMQ_HOST: rabbitmq
      DOCLING_DEVICE: cpu
    command:
      - celery
      - -A
      - app.worker.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
      - --queues=documents.ingest
    volumes:
      - .:/app
      - /app/.venv
