[project]
name = "customer-support-agent"
version = "0.1.0"
description = "API de agente de atendimento ao cliente para uma loja de instrumentos musicais."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "João Victor Araujo" },
]
keywords = [
    "ai-agent",
    "customer-service",
    "customer-support",
    "fastapi",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery>=5.5.3",
    "fastapi[standard]>=0.162.0",
    "minio>=7.2.16",
    "pgvector>=0.4.2",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.1.1",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Repository = "https://github.com/jVictorSA/customer-support-agent"

[project.scripts]
import-csv = "app.cli.import_csv:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.4.1.post1",
]
# Installed only by the ingestion worker image / integration runs:
#   uv sync --group worker
worker = [
    "docling>=2.143.1",
    "httpx>=0.28.1",
    "openai>=1.109.1",
    "pymupdf>=1.26.4",
    "tiktoken>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require a running Postgres instance",
    "provider: opt-in smoke tests that call a real external AI provider",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
